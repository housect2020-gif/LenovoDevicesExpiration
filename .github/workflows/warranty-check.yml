name: Lenovo Warranty Check

# Runs automatically whenever data/inventory.csv is updated (e.g. service desk
# uploads a new export), and can also be triggered manually from the Actions tab.
on:
  push:
    paths:
      - "data/inventory.csv"
  workflow_dispatch: {}

# Needed so this workflow can commit the results file back to the repo.
permissions:
  contents: write

jobs:
  run-warranty-check:
    runs-on: ubuntu-latest
    # Generous ceiling — a full run of ~350 devices typically takes 45-70
    # minutes with the batching/pausing built into the script.
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run warranty lookup
        run: python scripts/warranty_lookup.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update warranty results [skip ci]"

          # The lookup can take over an hour. If anyone edits other files in
          # the repo (like index.html) while it's running, main will have
          # moved on by the time we're ready to push our results — rebase
          # onto the latest main first so that doesn't cause a rejected push.
          git fetch origin main
          git rebase origin/main

          # Retry the push a few times in case of a last-second race with
          # another push (rare, but cheap to guard against).
          for i in 1 2 3; do
            git push && break
            echo "Push failed, retrying after re-fetch (attempt $i)..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
